version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DB_PATH: /app/data/zero-life.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GIN_MODE: release
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqlite_data: